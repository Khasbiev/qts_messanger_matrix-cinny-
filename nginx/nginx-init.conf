# ═══════════════════════════════════════════════════════════════
# Nginx — HTTP-only init config
# Used ONLY during initial SSL certificate acquisition (setup.sh)
# Serves the Let's Encrypt ACME challenge on port 80
# Replaced by nginx.conf after certs are obtained
# ═══════════════════════════════════════════════════════════════

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name messanger.qts.dev matrix.messanger.qts.dev;

        # Let's Encrypt ACME challenge — certbot writes tokens here
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # All other requests: just acknowledge (server not ready yet)
        location / {
            return 200 "Matrix server initializing, please wait...";
            add_header Content-Type text/plain;
        }
    }
}
