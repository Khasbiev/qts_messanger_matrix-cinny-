# ═══════════════════════════════════════════════════════════════
# Nginx — Production Config
# Handles:
#   messenger.qts.dev        → client web app + auth/push gateways + .well-known
#   messanger.qts.dev        → old (misspelled) domain, 301-redirects to the
#                              one above. Still serves /.well-known/matrix/*
#                              directly (NOT redirected) because Synapse's
#                              server_name is pinned to this old spelling —
#                              it's baked into every existing user's Matrix ID
#                              (@user:messanger.qts.dev) and can't be changed
#                              without breaking every account. Don't "fix" this.
#   matrix.messanger.qts.dev → Synapse homeserver API (unchanged, see above)
# ═══════════════════════════════════════════════════════════════

events {
    worker_connections 1024;
}

http {
    # ─────────────────────────────────────────
    # Shared SSL settings (Let's Encrypt best practices)
    # ─────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — tell browsers to always use HTTPS (1 year)
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ─────────────────────────────────────────
    # HTTP → HTTPS redirect + ACME challenge
    # ─────────────────────────────────────────
    server {
        listen 80;
        server_name messenger.qts.dev messanger.qts.dev matrix.messanger.qts.dev;

        # Certbot ACME challenge path (for SSL renewals)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ═══════════════════════════════════════════════════════════
    # messenger.qts.dev — client web app + Matrix .well-known
    # ═══════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name messenger.qts.dev;

        ssl_certificate     /etc/letsencrypt/live/messenger.qts.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/messenger.qts.dev/privkey.pem;

        # Security headers for the web client
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy strict-origin-when-cross-origin;

        # ─── Matrix .well-known delegation ──────────────────
        # Informational only on this domain — Synapse's actual server_name
        # is still the old "messanger.qts.dev" (see header comment), so THIS
        # is not what resolves @user:messanger.qts.dev. Served here too just
        # so this domain is self-describing if anyone looks it up directly.

        location = /.well-known/matrix/server {
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin *;
            return 200 '{"m.server":"matrix.messanger.qts.dev:443"}';
        }

        location = /.well-known/matrix/client {
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin *;
            return 200 '{"m.homeserver":{"base_url":"https://matrix.messanger.qts.dev"},"m.identity_server":{"base_url":"https://vector.im"}}';
        }

        # ─── Auth gateway (phone registration/login) ────────
        # Browser calls e.g. /api/auth/register — prefix is stripped
        # before reaching the container.
        location /api/auth/ {
            proxy_pass         http://auth-gateway:4001/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ─── Push gateway (Web Push subscribe/unsubscribe) ──
        # Browser calls e.g. /api/push/register — prefix is stripped
        # before reaching the container. Synapse's own server-to-server
        # notify calls go directly to the push-gateway container and
        # never pass through here.
        location /api/push/ {
            proxy_pass         http://push-gateway:4000/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ─── Client web app ──────────────────────────────────
        location / {
            proxy_pass         http://client:80;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # ═══════════════════════════════════════════════════════════
    # messanger.qts.dev — OLD (misspelled) domain. Redirects the web app
    # to the new domain, but keeps serving Matrix .well-known directly
    # (not redirected) because Synapse's server_name is pinned here.
    # ═══════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name messanger.qts.dev;

        # Same cert as the matrix.* block below (see setup.sh certbot -d flags)
        ssl_certificate     /etc/letsencrypt/live/messanger.qts.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/messanger.qts.dev/privkey.pem;

        # ─── Matrix .well-known delegation ──────────────────
        # Tells Matrix clients and other servers where Synapse is.
        # Without this, @user:messanger.qts.dev won't resolve. This MUST
        # keep being served directly from this exact old domain — Matrix
        # server discovery does not reliably follow redirects.

        location = /.well-known/matrix/server {
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin *;
            return 200 '{"m.server":"matrix.messanger.qts.dev:443"}';
        }

        location = /.well-known/matrix/client {
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin *;
            return 200 '{"m.homeserver":{"base_url":"https://matrix.messanger.qts.dev"},"m.identity_server":{"base_url":"https://vector.im"}}';
        }

        # ─── Everything else: send people to the correct domain ──
        location / {
            return 301 https://messenger.qts.dev$request_uri;
        }
    }

    # ═══════════════════════════════════════════════════════════
    # matrix.messanger.qts.dev — Synapse homeserver
    # ═══════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name matrix.messanger.qts.dev;

        ssl_certificate     /etc/letsencrypt/live/messanger.qts.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/messanger.qts.dev/privkey.pem;

        # Allow uploads up to 100 MB (matches max_upload_size in homeserver.yaml)
        client_max_body_size 100m;

        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        # CORS не добавляем — Synapse отдаёт их сам, дубли ломают браузер

        # ─── Proxy to Synapse ────────────────────────────────
        location / {
            proxy_pass         http://synapse:8008;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;

            # WebSocket support — required for Matrix /sync long-polling
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";

            # Long timeouts for Matrix /sync endpoint (holds connection open)
            proxy_read_timeout    600s;
            proxy_send_timeout    600s;
            proxy_connect_timeout  75s;

            # Disable buffering for real-time message delivery
            proxy_buffering off;
        }
    }
}
