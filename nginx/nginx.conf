# ═══════════════════════════════════════════════════════════════
# Nginx — Production Config
# Handles:
#   messanger.qts.dev       → Cinny web client + .well-known
#   matrix.messanger.qts.dev → Synapse homeserver API
# ═══════════════════════════════════════════════════════════════

events {
    worker_connections 1024;
}

http {
    # ─────────────────────────────────────────
    # Shared SSL settings (Let's Encrypt best practices)
    # ─────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — tell browsers to always use HTTPS (1 year)
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ─────────────────────────────────────────
    # HTTP → HTTPS redirect + ACME challenge
    # ─────────────────────────────────────────
    server {
        listen 80;
        server_name messanger.qts.dev matrix.messanger.qts.dev;

        # Certbot ACME challenge path (for SSL renewals)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ═══════════════════════════════════════════════════════════
    # messanger.qts.dev — Cinny web client + Matrix .well-known
    # ═══════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name messanger.qts.dev;

        # One cert covers both domains (see setup.sh certbot -d flags)
        ssl_certificate     /etc/letsencrypt/live/messanger.qts.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/messanger.qts.dev/privkey.pem;

        # Security headers for the web client
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy strict-origin-when-cross-origin;

        # ─── Matrix .well-known delegation ──────────────────
        # Tells Matrix clients and other servers where Synapse is.
        # Without this, @user:messanger.qts.dev won't resolve.

        location = /.well-known/matrix/server {
            # Points other Matrix servers to our Synapse federation endpoint
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin *;
            return 200 '{"m.server":"matrix.messanger.qts.dev:443"}';
        }

        location = /.well-known/matrix/client {
            # Points Matrix clients (mobile apps) to our Synapse API
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin *;
            return 200 '{"m.homeserver":{"base_url":"https://matrix.messanger.qts.dev"},"m.identity_server":{"base_url":"https://vector.im"}}';
        }

        # ─── Cinny web client ────────────────────────────────
        location / {
            proxy_pass         http://cinny:80;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # ═══════════════════════════════════════════════════════════
    # matrix.messanger.qts.dev — Synapse homeserver
    # ═══════════════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name matrix.messanger.qts.dev;

        ssl_certificate     /etc/letsencrypt/live/messanger.qts.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/messanger.qts.dev/privkey.pem;

        # Allow uploads up to 100 MB (matches max_upload_size in homeserver.yaml)
        client_max_body_size 100m;

        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy strict-origin-when-cross-origin;

        # CORS — required for Matrix web clients
        add_header Access-Control-Allow-Origin  *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization";

        # Handle CORS preflight without hitting Synapse
        if ($request_method = OPTIONS) {
            return 204;
        }

        # ─── Proxy to Synapse ────────────────────────────────
        location / {
            proxy_pass         http://synapse:8008;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;

            # WebSocket support — required for Matrix /sync long-polling
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";

            # Long timeouts for Matrix /sync endpoint (holds connection open)
            proxy_read_timeout    600s;
            proxy_send_timeout    600s;
            proxy_connect_timeout  75s;

            # Disable buffering for real-time message delivery
            proxy_buffering off;
        }
    }
}
