version: '3.8'

# ═══════════════════════════════════════════════════════════════
# Matrix Synapse + Cinny — Docker Compose
# Domains:
#   messanger.qts.dev       → Cinny web client
#   matrix.messanger.qts.dev → Synapse homeserver
# ═══════════════════════════════════════════════════════════════

services:

  # ─────────────────────────────────────────
  # PostgreSQL — Synapse database
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: matrix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Matrix requires C locale for correct text sorting
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - matrix-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Matrix Synapse — homeserver
  # ─────────────────────────────────────────
  synapse:
    image: matrixdotorg/synapse:latest
    container_name: matrix-synapse
    restart: unless-stopped
    environment:
      SYNAPSE_SERVER_NAME: ${SERVER_NAME}
      SYNAPSE_REPORT_STATS: "no"
    volumes:
      # All Synapse runtime data: signing key, media, log config
      - ./synapse/data:/data
      # Our production config (overrides any generated homeserver.yaml)
      - ./synapse/homeserver.yaml:/data/homeserver.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - matrix-net

  # ─────────────────────────────────────────
  # Cinny — Matrix web client
  # ─────────────────────────────────────────
  cinny:
    image: ajbura/cinny:latest
    container_name: matrix-cinny
    restart: unless-stopped
    volumes:
      - ./cinny/config.json:/app/config.json:ro
    networks:
      - matrix-net

  # ─────────────────────────────────────────
  # Nginx — reverse proxy with SSL
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: matrix-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - synapse
      - cinny
    networks:
      - matrix-net

  # ─────────────────────────────────────────
  # Certbot — automatic SSL renewal
  # Checks for renewal every 12 hours (certs expire every 90 days)
  # ─────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: matrix-certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
        while :; do
          certbot renew --quiet;
          sleep 12h & wait $${!};
        done"

volumes:
  postgres-data:

networks:
  matrix-net:
    driver: bridge
