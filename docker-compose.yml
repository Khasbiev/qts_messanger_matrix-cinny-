# ═══════════════════════════════════════════════════════════════
# QTS Messenger — Docker Compose
# Domains:
#   messanger.qts.dev        → client web app (+ auth/push gateways under /api/)
#   matrix.messanger.qts.dev → Synapse homeserver
# ═══════════════════════════════════════════════════════════════

services:

  # ─────────────────────────────────────────
  # PostgreSQL — Synapse database
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: matrix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Matrix requires C locale for correct text sorting
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - matrix-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Matrix Synapse — homeserver
  # ─────────────────────────────────────────
  synapse:
    image: matrixdotorg/synapse:latest
    container_name: matrix-synapse
    restart: unless-stopped
    environment:
      SYNAPSE_SERVER_NAME: ${SERVER_NAME}
      SYNAPSE_REPORT_STATS: "no"
    volumes:
      # All Synapse runtime data: signing key, media, log config
      - ./synapse/data:/data
      # Our production config (overrides any generated homeserver.yaml)
      - ./synapse/homeserver.yaml:/data/homeserver.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - matrix-net

  # ─────────────────────────────────────────
  # Client — custom React/Vite web app (static build served via nginx)
  # ─────────────────────────────────────────
  client:
    build:
      context: ./client
      args:
        # Left unset in prod — matrix.js falls back to the hardcoded
        # production homeserver default.
        VITE_HOMESERVER_URL: ""
        VITE_AUTH_GATEWAY_URL: "https://${SERVER_NAME}/api/auth"
        VITE_PUSH_GATEWAY_URL: "https://${SERVER_NAME}/api/push"
        # Synapse calls this one server-to-server (container network),
        # never the browser, so an internal docker DNS name is correct here.
        VITE_PUSH_GATEWAY_NOTIFY_URL: "http://push-gateway:4000"
        VITE_VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY}"
    container_name: matrix-client
    restart: unless-stopped
    networks:
      - matrix-net

  # ─────────────────────────────────────────
  # Auth gateway — phone-number registration/login bridge to Synapse's
  # admin API (holds registration_shared_secret, never exposed to the browser)
  # ─────────────────────────────────────────
  auth-gateway:
    build:
      context: ./auth-gateway
    container_name: matrix-auth-gateway
    restart: unless-stopped
    environment:
      REGISTRATION_SHARED_SECRET: ${SYNAPSE_REGISTRATION_SHARED_SECRET}
      SYNAPSE_URL: http://synapse:8008
      PORT: 4001
    depends_on:
      - synapse
    networks:
      - matrix-net

  # ─────────────────────────────────────────
  # Push gateway — bridges Synapse's Matrix Push Gateway API to real
  # VAPID-signed Web Push for desktop/mobile browser notifications
  # ─────────────────────────────────────────
  push-gateway:
    build:
      context: ./push-gateway
    container_name: matrix-push-gateway
    restart: unless-stopped
    environment:
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      PORT: 4000
    volumes:
      # Persists subscription pushkeys across restarts
      - ./push-gateway/data:/app/data
    networks:
      - matrix-net

  # ─────────────────────────────────────────
  # Nginx — reverse proxy with SSL
  # Certs managed by the certbot service below (renews automatically)
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: matrix-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - synapse
      - client
      - auth-gateway
      - push-gateway
    networks:
      - matrix-net

  # ─────────────────────────────────────────
  # Certbot — automatic SSL renewal
  # Checks for renewal every 12 hours (certs expire every 90 days)
  # ─────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: matrix-certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
        while :; do
          certbot renew --quiet;
          sleep 12h & wait $${!};
        done"

volumes:
  postgres-data:

networks:
  matrix-net:
    driver: bridge
    # Fixed subnet so synapse/homeserver.yaml.template's ip_range_whitelist
    # (needed for push-gateway delivery to bypass Synapse's SSRF blocklist)
    # can name it explicitly instead of guessing Docker's auto-assigned range.
    ipam:
      config:
        - subnet: 172.28.0.0/16
